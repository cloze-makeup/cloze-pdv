<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLOZE — PDV & Estoque</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 h-screen flex flex-col overflow-hidden">

  <!-- CONFIGURAÇÃO SUPABASE -->
  <script>
    // Cole suas chaves do Supabase aqui para ativar o banco na nuvem:
    const SUPABASE_URL = ""; 
    const SUPABASE_ANON_KEY = "";

    const isCloud = SUPABASE_URL && SUPABASE_ANON_KEY;
    const supabaseClient = isCloud ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  </script>

  <!-- HEADER / NAVBAR -->
  <header class="bg-white border-b border-stone-200 px-6 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-rose-600 text-white font-bold flex items-center justify-center text-lg tracking-wider">C</div>
      <div>
        <h1 class="font-bold text-lg tracking-tight text-stone-900 leading-none">CLOZE <span class="text-rose-600 font-medium text-sm">PDV</span></h1>
        <span id="status-db" class="text-[11px] text-amber-600 font-medium">● Modo Local (Configure o Supabase no código)</span>
      </div>
    </div>

    <nav class="flex gap-2 bg-stone-100 p-1 rounded-xl">
      <button onclick="mudarAba('pdv')" id="tab-pdv" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-white text-rose-600 shadow-sm transition">Frente de Caixa</button>
      <button onclick="mudarAba('estoque')" id="tab-estoque" class="px-4 py-1.5 rounded-lg text-sm font-semibold text-stone-600 hover:text-stone-900 transition">Produtos & Estoque</button>
      <button onclick="mudarAba('vendas')" id="tab-vendas" class="px-4 py-1.5 rounded-lg text-sm font-semibold text-stone-600 hover:text-stone-900 transition">Histórico</button>
    </nav>
  </header>

  <!-- ABA 1: FRENTE DE CAIXA (PDV) -->
  <main id="view-pdv" class="flex-1 flex overflow-hidden">
    <!-- Esquerda: Busca e Catálogo Rápido -->
    <div class="w-3/5 p-6 flex flex-col gap-4 overflow-hidden">
      <div class="relative">
        <input type="text" id="input-busca-pdv" placeholder="Bipe o código de barras ou digite nome, marca ou cor..." 
          class="w-full pl-4 pr-12 py-3.5 bg-white border border-stone-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-500 text-base" autofocus />
        <span class="absolute right-4 top-3.5 text-xs bg-stone-100 text-stone-500 px-2 py-1 rounded">ENTER</span>
      </div>

      <div id="grid-produtos-pdv" class="grid grid-cols-2 lg:grid-cols-3 gap-3 overflow-y-auto pr-1 pb-4">
        <!-- Cards injetados via JS -->
      </div>
    </div>

    <!-- Direita: Carrinho e Fechamento -->
    <div class="w-2/5 bg-white border-l border-stone-200 p-6 flex flex-col justify-between">
      <div class="flex flex-col overflow-hidden flex-1">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-stone-800">Sacola de Venda</h2>
          <button onclick="limparCarrinho()" class="text-xs text-stone-400 hover:text-rose-600">Limpar</button>
        </div>
        <div id="lista-carrinho" class="flex-1 overflow-y-auto divide-y divide-stone-100 pr-1">
          <!-- Itens do carrinho -->
        </div>
      </div>

      <div class="border-t border-stone-200 pt-4 mt-4 space-y-3">
        <div class="flex justify-between text-sm text-stone-500">
          <span>Subtotal</span>
          <span id="pdv-subtotal">R$ 0,00</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-stone-500">Desconto (R$)</span>
          <input type="number" id="pdv-desconto" value="0" min="0" step="0.50" oninput="atualizarTotais()" 
            class="w-24 text-right border border-stone-200 rounded-lg px-2 py-1 text-stone-800 font-medium" />
        </div>
        <div class="flex justify-between items-baseline pt-1">
          <span class="font-bold text-stone-800">Total a Pagar</span>
          <span id="pdv-total" class="text-2xl font-bold text-rose-600">R$ 0,00</span>
        </div>

        <div class="grid grid-cols-4 gap-2 pt-1">
          <button onclick="selecionarPagamento('Pix')" data-pg="Pix" class="btn-pg py-2 rounded-lg border text-xs font-semibold border-rose-600 bg-rose-50 text-rose-700">Pix</button>
          <button onclick="selecionarPagamento('Crédito')" data-pg="Crédito" class="btn-pg py-2 rounded-lg border border-stone-200 text-xs font-semibold text-stone-600">Crédito</button>
          <button onclick="selecionarPagamento('Débito')" data-pg="Débito" class="btn-pg py-2 rounded-lg border border-stone-200 text-xs font-semibold text-stone-600">Débito</button>
          <button onclick="selecionarPagamento('Dinheiro')" data-pg="Dinheiro" class="btn-pg py-2 rounded-lg border border-stone-200 text-xs font-semibold text-stone-600">Dinheiro</button>
        </div>

        <button onclick="finalizarVenda()" class="w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md transition active:scale-[0.99]">
          Finalizar Venda
        </button>
      </div>
    </div>
  </main>

  <!-- ABA 2: ESTOQUE E CADASTRO -->
  <main id="view-estoque" class="hidden flex-1 p-6 overflow-y-auto">
    <div class="max-w-6xl mx-auto space-y-6">
      <!-- Formulário de Cadastro Rápido -->
      <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm">
        <h2 class="font-bold text-stone-800 mb-4">Cadastrar Novo Produto</h2>
        <form id="form-produto" onsubmit="salvarProduto(event)" class="grid grid-cols-1 md:grid-cols-6 gap-3">
          <input type="text" id="prod-codigo" placeholder="Cód. Barras (Bipar)" class="border border-stone-300 rounded-lg px-3 py-2 text-sm" />
          <input type="text" id="prod-nome" placeholder="Nome (ex: Gloss Labial) *" required class="md:col-span-2 border border-stone-300 rounded-lg px-3 py-2 text-sm" />
          <input type="text" id="prod-marca" placeholder="Marca (ex: Franciny)" class="border border-stone-300 rounded-lg px-3 py-2 text-sm" />
          <input type="text" id="prod-variacao" placeholder="Cor / Tom (ex: Lip Honey)" class="border border-stone-300 rounded-lg px-3 py-2 text-sm" />
          <select id="prod-categoria" class="border border-stone-300 rounded-lg px-3 py-2 text-sm bg-white">
            <option value="Lábios">Lábios</option>
            <option value="Rosto">Rosto</option>
            <option value="Olhos">Olhos</option>
            <option value="Skincare">Skincare</option>
            <option value="Acessórios">Acessórios</option>
          </select>
          <input type="number" step="0.01" id="prod-custo" placeholder="Custo (R$)" class="border border-stone-300 rounded-lg px-3 py-2 text-sm" />
          <input type="number" step="0.01" id="prod-venda" placeholder="Preço Venda (R$) *" required class="border border-stone-300 rounded-lg px-3 py-2 text-sm" />
          <input type="number" id="prod-estoque" placeholder="Qtd Inicial *" required class="border border-stone-300 rounded-lg px-3 py-2 text-sm" />
          <input type="text" id="prod-validade" placeholder="Validade (ex: 10/2027)" class="border border-stone-300 rounded-lg px-3 py-2 text-sm" />
          <button type="submit" class="md:col-span-2 bg-stone-900 hover:bg-stone-800 text-white font-semibold rounded-lg py-2 text-sm transition">+ Adicionar ao Estoque</button>
        </form>
      </div>

      <!-- Tabela de Estoque -->
      <div class="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-stone-100 text-stone-600 font-semibold border-b border-stone-200">
            <tr>
              <th class="p-3.5">Produto / Marca</th>
              <th class="p-3.5">Tom / Variação</th>
              <th class="p-3.5">Cód. Barras</th>
              <th class="p-3.5">Venda</th>
              <th class="p-3.5">Estoque</th>
              <th class="p-3.5 text-right">Ajuste Rápido</th>
            </tr>
          </thead>
          <tbody id="tabela-estoque" class="divide-y divide-stone-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ABA 3: HISTÓRICO DE VENDAS -->
  <main id="view-vendas" class="hidden flex-1 p-6 overflow-y-auto">
    <div class="max-w-4xl mx-auto space-y-4">
      <div class="bg-white p-5 rounded-2xl border border-stone-200 flex justify-between items-center">
        <div>
          <p class="text-xs text-stone-500 uppercase font-semibold">Total Vendido (Registrado)</p>
          <h3 id="resumo-total-vendas" class="text-2xl font-bold text-stone-900">R$ 0,00</h3>
        </div>
        <span class="text-xs bg-rose-50 text-rose-600 px-3 py-1 rounded-full font-semibold">Cloze Store</span>
      </div>
      <div id="lista-vendas-historico" class="space-y-2"></div>
    </div>
  </main>

  <script>
    // ESTADO DA APLICAÇÃO
    let produtos = [];
    let carrinho = [];
    let vendas = [];
    let formaPagamento = 'Pix';

    // DADOS INICIAIS DE DEMONSTRAÇÃO (Caso o Supabase não esteja configurado)
    const demoProdutos = [
      { id: '1', codigo_barras: '7891001', nome: 'Base Líquida Matte', marca: 'Boca Rosa', categoria: 'Rosto', variacao: '2 - Ana', preco_custo: 28, preco_venda: 59.90, estoque_atual: 8, estoque_minimo: 3, validade: '08/2027' },
      { id: '2', codigo_barras: '7891002', nome: 'Gloss Lip Honey', marca: 'Franciny Ehlke', categoria: 'Lábios', variacao: 'Mel', preco_custo: 22, preco_venda: 45.00, estoque_atual: 2, estoque_minimo: 4, validade: '11/2027' },
      { id: '3', codigo_barras: '7891003', nome: 'Blush Compacto', marca: 'Bruna Tavares', categoria: 'Rosto', variacao: 'Magnólia', preco_custo: 24, preco_venda: 49.90, estoque_atual: 12, estoque_minimo: 3, validade: '05/2028' },
      { id: '4', codigo_barras: '7891004', nome: 'Máscara de Cílios', marca: 'Melu', categoria: 'Olhos', variacao: 'Preto Intenso', preco_custo: 9, preco_venda: 22.90, estoque_atual: 15, estoque_minimo: 5, validade: '02/2027' }
    ];

    // INICIALIZAÇÃO
    async function init() {
      if (isCloud) {
        document.getElementById('status-db').innerHTML = '<span class="text-emerald-600">● Conectado ao Supabase Cloud</span>';
        await carregarDadosCloud();
      } else {
        produtos = JSON.parse(localStorage.getItem('cloze_produtos')) || demoProdutos;
        vendas = JSON.parse(localStorage.getItem('cloze_vendas')) || [];
        salvarLocal();
      }
      renderizarTudo();
    }

    async function carregarDadosCloud() {
      const { data: prods } = await supabaseClient.from('produtos').select('*').order('nome');
      const { data: vnds } = await supabaseClient.from('vendas').select('*').order('criado_em', { ascending: false }).limit(50);
      if (prods) produtos = prods;
      if (vnds) vendas = vnds;
    }

    function salvarLocal() {
      if (!isCloud) {
        localStorage.setItem('cloze_produtos', JSON.stringify(produtos));
        localStorage.setItem('cloze_vendas', JSON.stringify(vendas));
      }
    }

    // NAVEGAÇÃO
    function mudarAba(aba) {
      ['pdv', 'estoque', 'vendas'].forEach(id => {
        document.getElementById(`view-${id}`).classList.toggle('hidden', id !== aba);
        const btn = document.getElementById(`tab-${id}`);
        btn.className = id === aba 
          ? 'px-4 py-1.5 rounded-lg text-sm font-semibold bg-white text-rose-600 shadow-sm transition'
          : 'px-4 py-1.5 rounded-lg text-sm font-semibold text-stone-600 hover:text-stone-900 transition';
      });
      if (aba === 'pdv') document.getElementById('input-busca-pdv').focus();
    }

    // BUSCA E LEITOR DE CÓDIGO DE BARRAS
    const inputBusca = document.getElementById('input-busca-pdv');
    inputBusca.addEventListener('input', () => renderizarGridPDV(inputBusca.value));
    inputBusca.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && inputBusca.value.trim() !== '') {
        const termo = inputBusca.value.trim().toLowerCase();
        // Busca exata por código de barras primeiro (ideal para leitor USB)
        const exato = produtos.find(p => p.codigo_barras && p.codigo_barras.toLowerCase() === termo);
        if (exato) {
          adicionarAoCarrinho(exato.id);
          inputBusca.value = '';
          renderizarGridPDV('');
        }
      }
    });

    // CARRINHO E VENDAS
    function adicionarAoCarrinho(id) {
      const prod = produtos.find(p => p.id === id);
      if (!prod || prod.estoque_atual <= 0) return alert('Produto sem estoque disponível!');

      const itemExistente = carrinho.find(i => i.produto_id === id);
      if (itemExistente) {
        if (itemExistente.quantidade >= prod.estoque_atual) return alert('Quantidade máxima em estoque atingida.');
        itemExistente.quantidade++;
      } else {
        carrinho.push({
          produto_id: prod.id,
          nome: prod.nome,
          variacao: prod.variacao,
          preco_unitario: Number(prod.preco_venda),
          quantidade: 1
        });
      }
      renderizarCarrinho();
    }

    function alterarQtdCarrinho(index, delta) {
      const item = carrinho[index];
      const prod = produtos.find(p => p.id === item.produto_id);
      const novaQtd = item.quantidade + delta;
      if (novaQtd <= 0) carrinho.splice(index, 1);
      else if (novaQtd <= prod.estoque_atual) item.quantidade = novaQtd;
      renderizarCarrinho();
    }

    function limparCarrinho() {
      carrinho = [];
      document.getElementById('pdv-desconto').value = 0;
      renderizarCarrinho();
    }

    function selecionarPagamento(pg) {
      formaPagamento = pg;
      document.querySelectorAll('.btn-pg').forEach(btn => {
        btn.className = btn.dataset.pg === pg
          ? 'btn-pg py-2 rounded-lg border text-xs font-semibold border-rose-600 bg-rose-50 text-rose-700'
          : 'btn-pg py-2 rounded-lg border border-stone-200 text-xs font-semibold text-stone-600';
      });
    }

    function atualizarTotais() {
      const subtotal = carrinho.reduce((acc, item) => acc + (item.preco_unitario * item.quantidade), 0);
      const desconto = Number(document.getElementById('pdv-desconto').value) || 0;
      const total = Math.max(0, subtotal - desconto);

      document.getElementById('pdv-subtotal').innerText = formatarMoeda(subtotal);
      document.getElementById('pdv-total').innerText = formatarMoeda(total);
      return { subtotal, desconto, total };
    }

    async function finalizarVenda() {
      if (carrinho.length === 0) return alert('Adicione itens à sacola primeiro.');
      const { desconto, total } = atualizarTotais();

      if (isCloud) {
        const { error } = await supabaseClient.rpc('registrar_venda', {
          p_total: total,
          p_desconto: desconto,
          p_forma_pagamento: formaPagamento,
          p_itens: carrinho
        });
        if (error) return alert('Erro ao registrar venda: ' + error.message);
        await carregarDadosCloud();
      } else {
        // Baixa local
        carrinho.forEach(item => {
          const p = produtos.find(prod => prod.id === item.produto_id);
          if (p) p.estoque_atual -= item.quantidade;
        });
        vendas.unshift({
          id: Date.now().toString(),
          total,
          desconto,
          forma_pagamento: formaPagamento,
          criado_em: new Date().toISOString(),
          itens: [...carrinho]
        });
        salvarLocal();
      }

      limparCarrinho();
      renderizarTudo();
      alert('Venda concluída com sucesso!');
    }

    // CADASTRO E AJUSTE DE ESTOQUE
    async function salvarProduto(e) {
      e.preventDefault();
      const novo = {
        codigo_barras: document.getElementById('prod-codigo').value.trim() || null,
        nome: document.getElementById('prod-nome').value.trim(),
        marca: document.getElementById('prod-marca').value.trim(),
        variacao: document.getElementById('prod-variacao').value.trim(),
        categoria: document.getElementById('prod-categoria').value,
        preco_custo: Number(document.getElementById('prod-custo').value) || 0,
        preco_venda: Number(document.getElementById('prod-venda').value),
        estoque_atual: Number(document.getElementById('prod-estoque').value),
        validade: document.getElementById('prod-validade').value.trim()
      };

      if (isCloud) {
        const { error } = await supabaseClient.from('produtos').insert([novo]);
        if (error) return alert('Erro ao salvar produto: ' + error.message);
        await carregarDadosCloud();
      } else {
        novo.id = Date.now().toString();
        produtos.unshift(novo);
        salvarLocal();
      }

      e.target.reset();
      renderizarTudo();
    }

    async function ajustarEstoque(id, delta) {
      const prod = produtos.find(p => p.id === id);
      if (!prod) return;
      const novaQtd = Math.max(0, prod.estoque_atual + delta);

      if (isCloud) {
        await supabaseClient.from('produtos').update({ estoque_atual: novaQtd }).eq('id', id);
        await carregarDadosCloud();
      } else {
        prod.estoque_atual = novaQtd;
        salvarLocal();
      }
      renderizarTudo();
    }

    // RENDERIZAÇÃO
    function formatarMoeda(v) {
      return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function renderizarTudo() {
      renderizarGridPDV(inputBusca.value);
      renderizarCarrinho();
      renderizarTabelaEstoque();
      renderizarHistorico();
    }

    function renderizarGridPDV(filtro = '') {
      const termo = filtro.toLowerCase();
      const filtrados = produtos.filter(p => 
        p.nome.toLowerCase().includes(termo) ||
        (p.marca && p.marca.toLowerCase().includes(termo)) ||
        (p.variacao && p.variacao.toLowerCase().includes(termo)) ||
        (p.codigo_barras && p.codigo_barras.includes(termo))
      );

      document.getElementById('grid-produtos-pdv').innerHTML = filtrados.map(p => `
        <button onclick="adicionarAoCarrinho('${p.id}')" ${p.estoque_atual <= 0 ? 'disabled' : ''}
          class="text-left bg-white p-3.5 rounded-xl border border-stone-200 hover:border-rose-400 transition flex flex-col justify-between shadow-sm disabled:opacity-50">
          <div>
            <div class="flex justify-between items-start gap-1">
              <span class="text-[11px] font-semibold uppercase tracking-wider text-rose-600">${p.marca || p.categoria}</span>
              <span class="text-[11px] px-1.5 py-0.5 rounded ${p.estoque_atual <= 3 ? 'bg-amber-100 text-amber-800 font-bold' : 'bg-stone-100 text-stone-600'}">
                ${p.estoque_atual} un
              </span>
            </div>
            <h3 class="font-bold text-stone-800 text-sm mt-1 leading-snug">${p.nome}</h3>
            ${p.variacao ? `<p class="text-xs text-stone-500 mt-0.5">${p.variacao}</p>` : ''}
          </div>
          <div class="mt-3 pt-2 border-t border-stone-100 flex justify-between items-center">
            <span class="font-bold text-stone-900">${formatarMoeda(p.preco_venda)}</span>
            <span class="text-xs text-rose-600 font-semibold">+ Add</span>
          </div>
        </button>
      `).join('');
    }

    function renderizarCarrinho() {
      const container = document.getElementById('lista-carrinho');
      if (carrinho.length === 0) {
        container.innerHTML = `<div class="h-full flex items-center justify-center text-stone-400 text-sm">Sacola vazia</div>`;
      } else {
        container.innerHTML = carrinho.map((item, idx) => `
          <div class="py-2.5 flex items-center justify-between gap-2">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold text-stone-800 truncate">${item.nome}</p>
              <p class="text-xs text-stone-500">${item.variacao || ''} • ${formatarMoeda(item.preco_unitario)}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="alterarQtdCarrinho(${idx}, -1)" class="w-6 h-6 rounded bg-stone-100 hover:bg-stone-200 font-bold text-stone-600">-</button>
              <span class="text-sm font-semibold w-4 text-center">${item.quantidade}</span>
              <button onclick="alterarQtdCarrinho(${idx}, 1)" class="w-6 h-6 rounded bg-stone-100 hover:bg-stone-200 font-bold text-stone-600">+</button>
            </div>
          </div>
        `).join('');
      }
      atualizarTotais();
    }

    function renderizarTabelaEstoque() {
      document.getElementById('tabela-estoque').innerHTML = produtos.map(p => `
        <tr class="hover:bg-stone-50">
          <td class="p-3.5">
            <div class="font-semibold text-stone-800">${p.nome}</div>
            <div class="text-xs text-stone-500">${p.marca || '-'} • Val: ${p.validade || '-'}</div>
          </td>
          <td class="p-3.5 text-stone-600">${p.variacao || '-'}</td>
          <td class="p-3.5 font-mono text-xs text-stone-500">${p.codigo_barras || '-'}</td>
          <td class="p-3.5 font-semibold text-stone-800">${formatarMoeda(p.preco_venda)}</td>
          <td class="p-3.5">
            <span class="px-2 py-1 rounded-md text-xs font-bold ${p.estoque_atual <= 3 ? 'bg-rose-100 text-rose-700' : 'bg-emerald-50 text-emerald-700'}">
              ${p.estoque_atual} un
            </span>
          </td>
          <td class="p-3.5 text-right space-x-1">
            <button onclick="ajustarEstoque('${p.id}', -1)" class="px-2.5 py-1 bg-stone-100 hover:bg-stone-200 rounded font-bold text-stone-700">-1</button>
            <button onclick="ajustarEstoque('${p.id}', 1)" class="px-2.5 py-1 bg-stone-100 hover:bg-stone-200 rounded font-bold text-stone-700">+1</button>
          </td>
        </tr>
      `).join('');
    }

    function renderizarHistorico() {
      const totalGeral = vendas.reduce((acc, v) => acc + Number(v.total), 0);
      document.getElementById('resumo-total-vendas').innerText = formatarMoeda(totalGeral);

      document.getElementById('lista-vendas-historico').innerHTML = vendas.map(v => `
        <div class="bg-white p-4 rounded-xl border border-stone-200 flex justify-between items-center">
          <div>
            <span class="text-xs font-bold px-2 py-0.5 rounded bg-stone-100 text-stone-700">${v.forma_pagamento}</span>
            <p class="text-xs text-stone-500 mt-1">${new Date(v.criado_em).toLocaleString('pt-BR')}</p>
          </div>
          <div class="text-right">
            <span class="font-bold text-stone-900">${formatarMoeda(v.total)}</span>
            ${v.desconto > 0 ? `<p class="text-[11px] text-rose-600">Desc: -${formatarMoeda(v.desconto)}</p>` : ''}
          </div>
        </div>
      `).join('');
    }

    init();
  </script>
</body>
</html>
